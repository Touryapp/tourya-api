name: Build & Deploy Tourya API to Cloud Run (Dev)

on:
  push:
    branches: [develop, feature/gcp-migration]

env:
  PROJECT_ID: tourya-project-dev
  REGION: us-east1
  SERVICE_NAME: tourya-dev-api
  PORT: 8088
  REGISTRY: us-east1-docker.pkg.dev/tourya-project-dev/tourya-dev

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/640622322458/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc'
          service_account: 'tourya-dev-cloud-run@tourya-project-dev.iam.gserviceaccount.com'

      - name: Configure Docker
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=${{ env.PORT }}
            --service-account=tourya-dev-cloud-run@tourya-project-dev.iam.gserviceaccount.com
            --vpc-connector=tourya-dev-vpc-connector
            # INF-05 quick fix (#206): min-instances=1 preserva 1 instancia viva para que
            # los @Scheduled jobs (PendingReservationNoShowJob, TemporalReservationExpiryJob,
            # TourReminder24hJob, CreditExpirationJob, ProviderPayoutOrderJob, etc.) disparen.
            # Cloud Run scale-to-zero mata @Scheduled porque no hay instancia corriendo cuando
            # llega la hora del cron. Costo ~$5-10/mes en dev. Para prod: migrar a Cloud
            # Scheduler externo con controllers internos (roadmap INF-06).
            --min-instances=1
            --max-instances=2
            --memory=1Gi
            --cpu=1
            --timeout=300
            --allow-unauthenticated
          env_vars: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            STORAGE_PROVIDER=GCP
            GCS_BUCKET=tourya-dev-storage
            GCP_PROJECT_ID=tourya-project-dev
          secrets: |
            JWT_SECRET=tourya-jwt-key:latest
            WOMPI_INTEGRITY_SECRET=tourya-wompi-integrity-secret:latest
            WOMPI_EVENTS_SECRET=tourya-wompi-events-secret:latest
            DB_PASSWORD=tourya-db-password:latest
            MAIL_PASSWORD=tourya-smtp-password:latest
