<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activación de cuenta Tourya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #212E47;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1b6475;
            margin-top: 0;
        }
        .activation-code {
            font-size: 36px;
            text-align: center;
            margin: 20px 0;
            color: #1b6475;
            font-weight: bold;
            letter-spacing: 4px;
        }
        .activation-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        .activation-link a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1b6475;
            color: #fff !important;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #E4EBF1;
            font-size: 12px;
            color: #6A7287;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Activá tu cuenta en Tourya</h1>
    <p class="greeting" th:text="'Hola ' + ${username} + ','"></p>
    <p>Gracias por registrarte. Usá el siguiente código para activar tu cuenta:</p>
    <div class="activation-code"><span th:text="${activation_code}"></span></div>
    <div class="activation-link">
        <a th:href="${confirmationUrl}" target="_blank">Activar mi cuenta</a>
    </div>
    <div class="footer">
        <p>Si no creaste esta cuenta, podés ignorar este correo.</p>
        <p>&mdash; El equipo de Tourya</p>
    </div>
</div>
</body>
</html>
