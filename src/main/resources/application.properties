#spring.application.name=tourya-api


spring.servlet.multipart.max-file-size=50MB
springdoc.default-produces-media-type=application/json
server.servlet.context-path=/api/v1/

server.port=8088
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/TourYaDbDev
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

payment.wompi.integrity.secret=${WOMPI_INTEGRITY_SECRET}
payment.wompi.events.secret=${WOMPI_EVENTS_SECRET}

# SEC-06: Social login (Token Exchange). Los valores reales vienen de GCP Secret Manager
# a traves de env vars en Cloud Run. Sin ellos, los endpoints /auth/google y /auth/facebook
# rechazan las requests (safe default).
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.facebook.app-id=${FACEBOOK_APP_ID:}
social.facebook.app-secret=${FACEBOOK_APP_SECRET:}


# Actuator: exponer solo endpoints publicos necesarios (health, info)
# No exponer *, evita filtrar env, beans, mappings, heapdump, threaddump, etc.
management.endpoints.web.exposure.include=health,info

# Configurar el contexto base para los endpoints de Actuator
management.endpoints.web.base-path=/actuator

# Mostrar detalles de health solo si el request esta autenticado (evita leak de estado interno)
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Opcional: Configuracion de JPA (si usas Spring Data JPA)
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#PARA EMAIL CREANDOME YO UN SERVIDOR DE EMAIL
#spring.mail.host=localhost
#spring.mail.port=1025
#spring.mail.username=user
#spring.mail.password=pass
#spring.mail.properties.mail.smtp.trust="*"
#spring.mail.properties.mail.auth=true
#spring.mail.properties.mail.starttls.enable=true
#spring.mail.properties.mail.connectiontimout=5000
#spring.mail.properties.mail.timeout=3000
#spring.mail.properties.mail.writetimeout=5000

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:*}
spring.mail.properties.mail.smtp.localhost=${MAIL_LOCALHOST:wass.com.co}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_TLS_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

#CONFIGURACION STORAGE (AWS o GCP)
storage.provider=${STORAGE_PROVIDER:AWS}

#CONFIGURACION S3 (usado cuando storage.provider=AWS)
aws.s3.bucket=${AWS_BUCKET:}
aws.s3.region=${AWS_REGION:us-east-1}
aws.accessKey=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}

#CONFIGURACION GCP (usado cuando storage.provider=GCP)
gcp.project-id=${GCP_PROJECT_ID:}
gcp.storage.bucket=${GCS_BUCKET:}


#Security
application.security.jwt.secret-key=${JWT_SECRET}
# access token: 1 dia
application.security.jwt.expiration=86400000
# refresh token: 30 dias por default; sobreescribir via JWT_REFRESH_EXPIRATION (ms)
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
application.mailing.frontend.activation-url=${ACTIVATION_URL:http://44.203.38.85:8088/api/v1/auth/activar-cuenta-web?token=}

# BE-18/19 (RN-036): URL a la que apunta el CTA "Usar mi credito" en el correo
# de recordatorio de expiracion. Por defecto apunta al home del frontend.
application.mailing.frontend.credit-url=${CREDIT_URL:https://tourya.co/}

# MO-40 Fase A: Firebase Admin SDK para push (FCM).
# Prioridad: FIREBASE_ADMIN_SDK_JSON (contenido JSON completo, patron Secret Manager)
# > FIREBASE_ADMIN_SDK_JSON_PATH (path a archivo, dev local).
# Si ninguna se setea, PushNotificationService corre en modo no-op sin fallar.
firebase.admin.sdk.json=${FIREBASE_ADMIN_SDK_JSON:}
firebase.admin.sdk.json.path=${FIREBASE_ADMIN_SDK_JSON_PATH:}

# IA-01: Anthropic API para agentes IA. Si ANTHROPIC_API_KEY no esta seteada,
# AnthropicClient corre en modo no-op (devuelve AgentLlmResponse.disabled). Los
# agentes que dependen de LLM registran resultType="rejected" en agent_audit_log.
agents.anthropic.api-key=${ANTHROPIC_API_KEY:}
agents.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}

# IA-02: Vertex AI Gemini como provider por defecto (Franklin 2026-08-14). Anthropic
# queda como impl alternativa (basta con AGENTS_PROVIDER=anthropic + ANTHROPIC_API_KEY).
# Auth via ADC: en Cloud Run usa la SA (tourya-dev-cloud-run con roles/aiplatform.user);
# en local Franklin ya corrio "gcloud auth application-default login".
agents.provider=${AGENTS_PROVIDER:gemini}
agents.gemini.enabled=${AGENTS_GEMINI_ENABLED:true}
agents.gemini.project-id=${GCP_PROJECT_ID:tourya-project-dev}
agents.gemini.location=${GEMINI_LOCATION:us-central1}

# IA-07: Operator Support (asistente wizard tour + reseñas). Feature flag por
# si Franklin necesita apagar el agente rapidamente sin re-deploy.
agents.operator.enabled=${AGENTS_OPERATOR_ENABLED:true}

# IA-09: Google Cloud Translation v3 — traduccion automatica es->en/pt-BR al guardar un tour.
# La convencion de storage en JSONB usa las claves "en" y "pt"; internamente el service
# mapea "pt" -> "pt-BR" para que Google traduzca a portugues de Brasil (la propuesta con Luis).
# Auth via ADC (misma SA que Vertex AI). Si enabled=false o el SDK falla al inicializar,
# el service corre en modo no-op (devuelve null y isEnabled()=false) sin romper el flujo.
agents.translation.enabled=${AGENTS_TRANSLATION_ENABLED:true}
agents.translation.project-id=${GCP_PROJECT_ID:tourya-project-dev}
agents.translation.source-lang=${TRANSLATION_SOURCE_LANG:es}
agents.translation.target-langs=${TRANSLATION_TARGET_LANGS:en,pt}
